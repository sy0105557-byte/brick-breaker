<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벽돌깨기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0f1020; color: #e8e8f0;
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    padding: 16px; touch-action: none;
  }
  h1 { font-size: 1.6rem; margin-bottom: 8px; letter-spacing: 2px; }
  #hud { display: flex; gap: 24px; margin-bottom: 8px; font-size: 1rem; }
  canvas {
    width: 100%; max-width: 480px; aspect-ratio: 480 / 640;
    background: #181a33; border: 2px solid #3a3d6b; border-radius: 8px;
    display: block;
  }
  #help { margin-top: 10px; font-size: 0.85rem; color: #9a9cc0; text-align: center; }
</style>
</head>
<body>
<h1>🧱 벽돌깨기</h1>
<div id="hud">
  <span>점수: <b id="score">0</b></span>
  <span>목숨: <b id="lives">3</b></span>
  <span>레벨: <b id="level">1</b></span>
</div>
<canvas id="game" width="480" height="640"></canvas>
<p id="help">← → 또는 마우스/터치로 이동 · 스페이스/클릭으로 발사 · P 일시정지</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const ui = {
  score: document.getElementById('score'),
  lives: document.getElementById('lives'),
  level: document.getElementById('level'),
};

const COLORS = ['#ff5d73', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#b197fc'];
const BRICK = { rows: 6, cols: 8, w: 52, h: 20, gap: 6, top: 70 };
BRICK.left = (W - (BRICK.cols * BRICK.w + (BRICK.cols - 1) * BRICK.gap)) / 2;

const paddle = { w: 90, h: 12, x: W / 2 - 45, y: H - 40, speed: 7 };
const ball = { r: 7, x: 0, y: 0, dx: 0, dy: 0, stuck: true };

let bricks = [];
let score = 0, lives = 3, level = 1;
let state = 'ready'; // ready | playing | paused | over | win
const keys = {};

function buildBricks() {
  bricks = [];
  for (let r = 0; r < BRICK.rows; r++) {
    for (let c = 0; c < BRICK.cols; c++) {
      // 레벨이 올라가면 위쪽 줄은 2번 맞아야 깨짐
      const hp = (level > 1 && r < Math.min(level - 1, 3)) ? 2 : 1;
      bricks.push({
        x: BRICK.left + c * (BRICK.w + BRICK.gap),
        y: BRICK.top + r * (BRICK.h + BRICK.gap),
        color: COLORS[r % COLORS.length], hp, alive: true,
      });
    }
  }
}

function resetBall() {
  ball.stuck = true;
  ball.x = paddle.x + paddle.w / 2;
  ball.y = paddle.y - ball.r - 1;
}

function launch() {
  if (!ball.stuck) return;
  const speed = 4.5 + level * 0.5;
  const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
  ball.dx = Math.cos(angle) * speed;
  ball.dy = Math.sin(angle) * speed;
  ball.stuck = false;
}

function newGame() {
  score = 0; lives = 3; level = 1;
  buildBricks(); resetBall(); updateHud();
  state = 'ready';
}

function updateHud() {
  ui.score.textContent = score;
  ui.lives.textContent = lives;
  ui.level.textContent = level;
}

function action() {
  if (state === 'over' || state === 'win') { newGame(); return; }
  if (state === 'paused') { state = 'playing'; return; }
  state = 'playing';
  launch();
}

// 입력
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.code === 'Space') { e.preventDefault(); action(); }
  if (e.key === 'p' || e.key === 'P') {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function pointerToPaddle(clientX) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
}
canvas.addEventListener('mousemove', e => pointerToPaddle(e.clientX));
canvas.addEventListener('click', action);
canvas.addEventListener('touchstart', e => { pointerToPaddle(e.touches[0].clientX); action(); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove', e => { pointerToPaddle(e.touches[0].clientX); e.preventDefault(); }, { passive: false });

function update() {
  if (keys['ArrowLeft']) paddle.x = Math.max(0, paddle.x - paddle.speed);
  if (keys['ArrowRight']) paddle.x = Math.min(W - paddle.w, paddle.x + paddle.speed);

  if (ball.stuck) { resetBall(); return; }
  if (state !== 'playing') return;

  ball.x += ball.dx;
  ball.y += ball.dy;

  // 벽 충돌
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx *= -1; }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx *= -1; }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy *= -1; }

  // 패들 충돌: 맞은 위치에 따라 반사각 변경
  if (ball.dy > 0 &&
      ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + ball.dy &&
      ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    const speed = Math.hypot(ball.dx, ball.dy);
    const angle = hit * (Math.PI / 3);
    ball.dx = Math.sin(angle) * speed;
    ball.dy = -Math.abs(Math.cos(angle) * speed);
    ball.y = paddle.y - ball.r;
  }

  // 벽돌 충돌
  for (const b of bricks) {
    if (!b.alive) continue;
    const nx = Math.max(b.x, Math.min(ball.x, b.x + BRICK.w));
    const ny = Math.max(b.y, Math.min(ball.y, b.y + BRICK.h));
    const ddx = ball.x - nx, ddy = ball.y - ny;
    if (ddx * ddx + ddy * ddy <= ball.r * ball.r) {
      // 겹친 방향으로 반사
      const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BRICK.w - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BRICK.h - (ball.y - ball.r));
      if (overlapX < overlapY) ball.dx *= -1; else ball.dy *= -1;
      b.hp--;
      if (b.hp <= 0) { b.alive = false; score += 10 * level; }
      else score += 5;
      updateHud();
      break;
    }
  }

  // 바닥으로 떨어짐
  if (ball.y - ball.r > H) {
    lives--; updateHud();
    if (lives <= 0) { state = 'over'; }
    else { state = 'ready'; resetBall(); }
  }

  // 레벨 클리어
  if (bricks.every(b => !b.alive)) {
    if (level >= 5) { state = 'win'; }
    else { level++; buildBricks(); resetBall(); state = 'ready'; updateHud(); }
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawMessage(title, sub) {
  ctx.fillStyle = 'rgba(15,16,32,0.75)';
  ctx.fillRect(0, H / 2 - 60, W, 120);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 32px system-ui, "Malgun Gothic", sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 5);
  ctx.font = '16px system-ui, "Malgun Gothic", sans-serif';
  ctx.fillStyle = '#c0c2e0';
  ctx.fillText(sub, W / 2, H / 2 + 28);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    ctx.globalAlpha = b.hp > 1 ? 1 : 0.85;
    roundRect(b.x, b.y, BRICK.w, BRICK.h, 4);
    ctx.fill();
    if (b.hp > 1) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#e8e8f0';
  roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd43b';
  ctx.fill();

  if (state === 'ready') drawMessage(`레벨 ${level}`, '스페이스 또는 클릭으로 시작');
  if (state === 'paused') drawMessage('일시정지', 'P 또는 클릭으로 계속');
  if (state === 'over') drawMessage('게임 오버', `점수 ${score} · 클릭으로 다시 시작`);
  if (state === 'win') drawMessage('🎉 클리어!', `점수 ${score} · 클릭으로 다시 시작`);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

newGame();
loop();
</script>
</body>
</html>
